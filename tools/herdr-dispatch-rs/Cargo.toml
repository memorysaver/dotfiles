[package]
name = "herdr-dispatch"
version = "0.1.0"
edition = "2021"
autobins = false
rust-version = "1.85"
description = "Single Rust CLI for local Computer and Project orchestration and dispatch"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = true }
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
libc = "0.2"
log = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "workspace-orchestrator"
path = "src/bin/workspace-orchestrator.rs"
