[package]
name = "herdr-dispatch"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Allowlisted local broker for dispatching OpenAB work into Herdr"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = true }
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "herdr-dispatch"
path = "src/bin/herdr-dispatch.rs"

[[bin]]
name = "herdr-dispatchd"
path = "src/bin/herdr-dispatchd.rs"
